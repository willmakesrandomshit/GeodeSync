name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "release/v*"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.arch }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            minimum_macos: "11.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum_macos: "10.15"
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Confirm bundled GUI runtime is available
        run: python -c "import tkinter; print('Python', __import__('sys').version); print('Tk', tkinter.TkVersion)"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install build tool
        run: python -m pip install -r requirements-macos-build.txt
      - name: Build app
        run: python build_macos.py --arch "${{ matrix.arch }}"
      - name: Sign with Developer ID
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/geodesync-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/geodesync.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/geodesync.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/geodesync.keychain-db"
          # shellcheck disable=SC2046 # Preserve every existing keychain in the search list.
          security list-keychains -d user -s "$RUNNER_TEMP/geodesync.keychain-db" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/geodesync-signing.p12" -k "$RUNNER_TEMP/geodesync.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/geodesync.keychain-db"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/GeodeSync.app
          codesign --verify --deep --strict dist/GeodeSync.app
      - name: Notarize and staple app
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/GeodeSync.app "$RUNNER_TEMP/GeodeSync-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/GeodeSync-notarization.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple dist/GeodeSync.app
          xcrun stapler validate dist/GeodeSync.app
          spctl --assess --type execute --verbose=4 dist/GeodeSync.app
          codesign --verify --deep --strict dist/GeodeSync.app
      - name: Verify app bundle and executable architecture
        run: |
          test -d dist/GeodeSync.app
          test -x dist/GeodeSync.app/Contents/MacOS/GeodeSync
          test -d dist/GeodeSync.app/Contents/Frameworks/Python.framework
          test -e dist/GeodeSync.app/Contents/Frameworks/Tcl
          test -e dist/GeodeSync.app/Contents/Frameworks/Tk
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/GeodeSync.app/Contents/Info.plist)" = "${{ matrix.minimum_macos }}"
          test "$(lipo -archs dist/GeodeSync.app/Contents/MacOS/GeodeSync)" = "${{ matrix.arch }}"
          file dist/GeodeSync.app/Contents/MacOS/GeodeSync
          # The build script signs the finished bundle ad-hoc when no Developer
          # ID identity is configured. Always verify so a stale/broken resource
          # seal cannot be published as a "damaged" app.
          codesign --verify --deep --strict dist/GeodeSync.app
      - name: Package app for download
        run: ditto -c -k --sequesterRsrc --keepParent dist/GeodeSync.app "GeodeSync-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        with:
          name: GeodeSync-macOS-${{ matrix.arch }}
          path: GeodeSync-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tool
        run: python -m pip install -r requirements-windows-build.txt
      - name: Run regression suite on Windows
        run: python -m unittest discover -s tests -v
      - name: Build and package Windows onedir app
        shell: pwsh
        run: |
          ./package_windows.ps1
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).app_version
          Copy-Item "dist/GeodeSync-v$version-Windows.zip" "GeodeSync-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GeodeSync-Windows
          path: |
            GeodeSync-Windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux release assets
    # Build against Ubuntu 22.04 (glibc 2.35), which is compatible with SteamOS
    # on Steam Deck. Building on ubuntu-latest can bundle newer Tcl/Tk libraries
    # that fail to load on SteamOS (for example, requiring GLIBC_2.42).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv python3-tk xvfb xauth
      - name: Verify Steam Deck-compatible glibc build baseline
        run: |
          python3 - <<'PY'
          import platform
          import re
          version = platform.libc_ver()[1]
          match = re.match(r"^(\d+)\.(\d+)", version)
          if not match or tuple(map(int, match.groups())) > (2, 35):
              raise SystemExit(f"Expected glibc <= 2.35 for SteamOS compatibility; found {version!r}")
          print(f"Building against glibc {version} for SteamOS compatibility")
          PY
      - name: Create build environment with the system Tk runtime
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -c "import tkinter; print('Python', __import__('sys').version); print('Tk', tkinter.TkVersion)"
      - name: Install build tool
        run: |
          .venv/bin/python -m pip install -r requirements-linux-build.txt
      - name: Run regression suite on Linux
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
      - name: Build Linux executable
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed --name GeodeSync --add-data "icon.ico:." main.py
      - name: Package Linux downloads
        run: |
          mkdir -p dist/GeodeSync-Linux
          cp dist/GeodeSync dist/GeodeSync-Linux/GeodeSync
          cp run-geodesync-linux.sh dist/GeodeSync-Linux/run.sh
          cp README-Linux.txt dist/GeodeSync-Linux/README-Linux.txt
          cp README.md dist/GeodeSync-Linux/README.md
          cp USER_GUIDE.md dist/GeodeSync-Linux/USER_GUIDE.md
          cp assets/geodesync-app-icon.png dist/GeodeSync-Linux/icon.png
          chmod +x dist/GeodeSync-Linux/GeodeSync dist/GeodeSync-Linux/run.sh
      - name: Launch packaged app in a virtual Linux desktop
        run: |
          set +e
          timeout 15s xvfb-run -a ./dist/GeodeSync-Linux/run.sh > /tmp/geodesync-linux-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/geodesync-linux-smoke.log
          if [ "$status" -ne 124 ]; then
            echo "GeodeSync did not remain open in the virtual desktop (exit $status)." >&2
            exit 1
          fi
      - name: Create Linux release archive
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['app_version'])")
          tar -czf "GeodeSync-v${VERSION}-Linux.tar.gz" -C dist/GeodeSync-Linux GeodeSync run.sh README-Linux.txt README.md USER_GUIDE.md icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: GeodeSync-Linux
          path: |
            GeodeSync-v*-Linux.tar.gz
          if-no-files-found: error

  attach-to-release:
    name: Attach platform builds to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    # Keep optional macOS packaging from blocking the verified Windows/Linux release.
    # macOS assets remain withheld until a notarized package is explicitly attached.
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GeodeSync-Windows
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: GeodeSync-Linux
          path: .
      - name: Confirm release ref matches application version
        id: version
        run: |
          APP_VERSION=$(python3 - <<'PY'
          import re
          match = re.search(r'^APP_VERSION = "([^"]+)"', open("main.py").read(), re.MULTILINE)
          if not match:
              raise SystemExit("APP_VERSION is missing")
          print(match.group(1))
          PY
          )
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$APP_VERSION"
          else
            test "$GITHUB_REF_NAME" = "release/v$APP_VERSION"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate SHA-256 release checksums
        run: |
          shopt -s nullglob
          assets=(GeodeSync-Windows.zip GeodeSync-macOS-*.zip GeodeSync-v*-Linux.tar.gz)
          test "${#assets[@]}" -gt 0
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          {
            echo 'files<<EOF'
            printf '%s\n' "${assets[@]}" SHA256SUMS.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
          printf 'asset_names=%s\n' "$(IFS=,; echo "${assets[*]}")" >> "$GITHUB_OUTPUT"
          cp release_notes.md release_notes_for_release.md
          if ! compgen -G 'GeodeSync-macOS-*.zip' > /dev/null; then
            printf '\n%s\n\n%s\n' \
              '## macOS download status' \
              'The macOS packages are temporarily withheld because this release was not signed with an Apple Developer ID and notarized. Do not use an older or ad-hoc-signed package as a replacement. Windows and Linux packages are available below; the Mac package will be added only after Apple verification succeeds.' \
              >> release_notes_for_release.md
          fi
        id: assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          name: GeodeSync v${{ steps.version.outputs.app_version }}
          body_path: release_notes_for_release.md
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
      - name: Announce release in Discord
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GEODESYNC_DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: v${{ steps.version.outputs.app_version }}
          RELEASE_TITLE: GeodeSync v${{ steps.version.outputs.app_version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.app_version }}
          RELEASE_ASSETS: ${{ steps.assets.outputs.asset_names }}
          RELEASE_BODY_FILE: release_notes_for_release.md
        run: |
          if [ -z "$GEODESYNC_DISCORD_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is missing; release is published, but its optional Discord announcement was skipped." >&2
            exit 0
          fi
          python3 send_discord_update.py
