name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.arch }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            minimum_macos: "11.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum_macos: "10.15"
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Confirm bundled GUI runtime is available
        run: python -c "import tkinter; print('Python', __import__('sys').version); print('Tk', tkinter.TkVersion)"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install build tool
        run: python -m pip install -r requirements-macos-build.txt
      - name: Build app
        run: python build_macos.py --arch "${{ matrix.arch }}"
      - name: Sign with Developer ID
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/geodesync-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/geodesync.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/geodesync.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/geodesync.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/geodesync.keychain-db" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/geodesync-signing.p12" -k "$RUNNER_TEMP/geodesync.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/geodesync.keychain-db"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/GeodeSync.app
          codesign --verify --deep --strict dist/GeodeSync.app
      - name: Notarize and staple app
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/GeodeSync.app "$RUNNER_TEMP/GeodeSync-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/GeodeSync-notarization.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple dist/GeodeSync.app
          codesign --verify --deep --strict dist/GeodeSync.app
      - name: Verify app bundle and executable architecture
        run: |
          test -d dist/GeodeSync.app
          test -x dist/GeodeSync.app/Contents/MacOS/GeodeSync
          test -d dist/GeodeSync.app/Contents/Frameworks/Python.framework
          test -e dist/GeodeSync.app/Contents/Frameworks/Tcl
          test -e dist/GeodeSync.app/Contents/Frameworks/Tk
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/GeodeSync.app/Contents/Info.plist)" = "${{ matrix.minimum_macos }}"
          test "$(lipo -archs dist/GeodeSync.app/Contents/MacOS/GeodeSync)" = "${{ matrix.arch }}"
          file dist/GeodeSync.app/Contents/MacOS/GeodeSync
          if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
            codesign --verify --deep --strict dist/GeodeSync.app
          else
            echo "No Apple signing identity configured; packaging the structurally verified community build unsigned."
          fi
      - name: Package app for download
        run: ditto -c -k --sequesterRsrc --keepParent dist/GeodeSync.app "GeodeSync-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GeodeSync-macOS-${{ matrix.arch }}
          path: GeodeSync-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tool
        run: python -m pip install -r requirements-windows-build.txt
      - name: Build Windows executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name GeodeSync --icon icon.ico --version-file version_info.txt
          --manifest app.manifest --add-data "icon.ico;." main.py
      - name: Package Windows downloads
        shell: pwsh
        run: |
          Copy-Item dist/GeodeSync.exe ./GeodeSync.exe
          New-Item -ItemType Directory -Force -Path ./GeodeSync-Windows | Out-Null
          Copy-Item dist/GeodeSync.exe ./GeodeSync-Windows/GeodeSync.exe
          Copy-Item README.md ./GeodeSync-Windows/README.txt
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).app_version
          Compress-Archive -Path ./GeodeSync-Windows/* -DestinationPath "./GeodeSync-v$version-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GeodeSync-Windows
          path: |
            GeodeSync.exe
            GeodeSync-v*-Windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Install build tool
        run: |
          python -m pip install pyinstaller
      - name: Build Linux executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GeodeSync --add-data "icon.ico:." main.py
      - name: Package Linux downloads
        run: |
          mkdir -p dist/GeodeSync-Linux
          cp dist/GeodeSync dist/GeodeSync-Linux/GeodeSync
          chmod +x dist/GeodeSync-Linux/GeodeSync
          cp README.md dist/GeodeSync-Linux/README.md
          cat << 'EOF' > dist/GeodeSync-Linux/run.sh
#!/bin/bash
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
chmod +x "$DIR/GeodeSync"
"$DIR/GeodeSync" "$@"
EOF
          chmod +x dist/GeodeSync-Linux/run.sh
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['app_version'])")
          tar -czvf "GeodeSync-v${VERSION}-Linux.tar.gz" -C dist/GeodeSync-Linux .
      - uses: actions/upload-artifact@v4
        with:
          name: GeodeSync-Linux
          path: GeodeSync-v*-Linux.tar.gz
          if-no-files-found: error

  attach-to-release:
    name: Attach platform builds to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GeodeSync-macOS-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: GeodeSync-Windows
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: GeodeSync-Linux
          path: .
      - name: Confirm release ref matches application version
        id: version
        run: |
          APP_VERSION=$(python3 - <<'PY'
          import re
          match = re.search(r'^APP_VERSION = "([^"]+)"', open("main.py").read(), re.MULTILINE)
          if not match:
              raise SystemExit("APP_VERSION is missing")
          print(match.group(1))
          PY
          )
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$APP_VERSION"
          else
            test "$GITHUB_REF_NAME" = "release/v$APP_VERSION"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          name: GeodeSync v${{ steps.version.outputs.app_version }}
          body_path: release_notes.md
          files: |
            GeodeSync.exe
            GeodeSync-v*-Windows.zip
            GeodeSync-macOS-*.zip
            GeodeSync-v*-Linux.tar.gz
          fail_on_unmatched_files: true
