name: Notify Discord on Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to announce again (for example, v2.3.6)
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the trusted default-branch notifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Load the selected published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag. Expected a version such as v2.3.6." >&2; exit 1 ;;
          esac
          gh release view "$RELEASE_TAG" --json name,tagName,body,url > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os, uuid
          with open(os.path.join(os.environ["RUNNER_TEMP"], "release.json"), encoding="utf-8") as f:
              release = json.load(f)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in (
                  ("RELEASE_TITLE", release.get("name") or release["tagName"]),
                  ("RELEASE_TAG", release["tagName"]),
                  ("RELEASE_BODY", release.get("body") or ""),
                  ("RELEASE_URL", release["url"]),
              ):
                  delimiter = "GEODESYNC_" + uuid.uuid4().hex
                  env_file.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          PY
      - name: Send branded Discord release announcement
        env:
          GEODESYNC_DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if [ -z "$GEODESYNC_DISCORD_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is missing; announcement was not sent." >&2
            exit 1
          fi
          python3 send_discord_update.py
