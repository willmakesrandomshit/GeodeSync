name: Notify Discord on Release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Announcement to Channel
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK secret not set. Skipping Discord notification."
            exit 0
          fi

          python3 - << 'EOF'
          import os, json, urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          title = os.environ.get("RELEASE_TITLE") or os.environ.get("RELEASE_TAG") or "New Update Released!"
          tag = os.environ.get("RELEASE_TAG") or "latest"
          body = os.environ.get("RELEASE_BODY") or "A new update for GeodeSync is now available!"
          rel_url = os.environ.get("RELEASE_URL") or "https://github.com/willmakesrandomshit/GeodeSync/releases/latest"

          # Truncate body if too long for embed description
          if len(body) > 1800:
              body = body[:1800] + "... [Read full release on GitHub]"

          payload = {
              "content": "⚡ **New GeodeSync Update Released!**",
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": f"🚀 {title}",
                      "url": rel_url,
                      "description": body,
                      "color": 0xc2e66b,
                      "fields": [
                          {
                              "name": "📦 Downloads",
                              "value": f"[Download Windows (.exe / .zip)]({rel_url})\n[Download Linux (.tar.gz)]({rel_url})\n[Download macOS (.zip)]({rel_url})"
                          }
                      ],
                      "footer": {
                          "text": f"GeodeSync {tag} • Channel Auto-Broadcast"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GeodeSync-Release-Notifier"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print("Discord notification sent successfully!")
          except Exception as e:
              print(f"Failed to dispatch Discord webhook: {e}")
          EOF
